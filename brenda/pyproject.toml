[project]
name = "brenda"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "basedpyright>=1.29.4",
    "biopython>=1.85",
    "black>=25.1.0",
    "brendapyrser>=0.0.2",
    "dataclass-csv>=1.4.0",
    "dataclasses-json>=0.6.7",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "requests>=2.32.4",
    # Backward compatibility to make dataclass-csv work
    "setuptools>=80.9.0",
]

[tool.basedpyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = ["ipykernel>=6.29.5"]
